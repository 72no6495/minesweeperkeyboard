name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "公開するリリースのタグ（例: v1.0.0）。空ならビルドのみ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/minesweeper-ime-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/minesweeper-ime-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minesweeper-ime-apk
          path: dist/*.apk

      # v* タグの push、または手動実行で release_tag を指定すると
      # GitHub Release を作成して APK を添付する（タグが無ければこのコミットに作成）
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cp dist/minesweeper-ime-release.apk "dist/minesweeper-ime-${TAG}.apk"
          gh release create "$TAG" "dist/minesweeper-ime-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "マインスイーパーIME ${TAG}" \
            --generate-notes
